<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f1020" />
  <title>テトリス for iPad</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="stat">
        <span class="label">SCORE</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">LINES</span>
        <span id="lines" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">LEVEL</span>
        <span id="level" class="value">1</span>
      </div>
    </header>

    <main class="play-area">
      <div class="side">
        <div class="panel">
          <span class="label">HOLD</span>
          <canvas id="hold" width="96" height="96"></canvas>
        </div>
      </div>

      <div class="board-wrap">
        <canvas id="board"></canvas>
        <div id="overlay" class="overlay hidden">
          <div class="overlay-card">
            <h1 id="overlay-title">テトリス</h1>
            <p id="overlay-text">画面をタップ、またはスタートで開始</p>
            <button id="start-btn" class="btn">スタート</button>
          </div>
        </div>
      </div>

      <div class="side">
        <div class="panel">
          <span class="label">NEXT</span>
          <canvas id="next" width="96" height="288"></canvas>
        </div>
      </div>
    </main>

    <footer class="controls">
      <button class="ctrl" data-action="left" aria-label="左へ移動">◀</button>
      <button class="ctrl" data-action="rotate" aria-label="回転">⟳</button>
      <button class="ctrl" data-action="right" aria-label="右へ移動">▶</button>
      <button class="ctrl" data-action="hold" aria-label="ホールド">HOLD</button>
      <button class="ctrl" data-action="softdrop" aria-label="ソフトドロップ">▼</button>
      <button class="ctrl wide" data-action="harddrop" aria-label="ハードドロップ">DROP</button>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
