<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f1020" />
  <title>ゲームセレクト for iPad</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%;
      background: #0f1020; color: #e8eaff;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 28px; padding: 32px 20px;
      padding-top: max(32px, env(safe-area-inset-top));
    }
    h1 { font-size: 30px; letter-spacing: 2px; margin: 0; text-align: center; }
    p.sub { margin: 0; color: #8a8fc0; text-align: center; }
    .menu {
      display: flex; flex-wrap: wrap; gap: 20px;
      justify-content: center; width: 100%; max-width: 760px;
    }
    .card {
      flex: 1 1 280px; max-width: 360px;
      text-decoration: none; color: #fff;
      border-radius: 22px; padding: 40px 28px;
      display: flex; flex-direction: column; gap: 10px;
      transition: transform 0.1s;
    }
    .card:active { transform: scale(0.97); }
    .card.tetris { background: linear-gradient(140deg, #6c7bff, #3aa0ff); }
    .card.puyo { background: linear-gradient(140deg, #ff4d6d, #ffd23f); }
    .card.profile { background: linear-gradient(140deg, #2fbf71, #12a5b8); }
    .card .emoji { font-size: 52px; }
    .card .name { font-size: 26px; font-weight: 800; letter-spacing: 1px; }
    .card .desc { font-size: 14px; opacity: 0.9; }
    footer { color: #5b5f8c; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>🎮 ゲームセレクト</h1>
      <p class="sub">iPadで遊べるタッチ操作ゲーム</p>
    </div>
    <div class="menu">
      <a class="card puyo" href="/puyo">
        <span class="emoji">🟢🔴🔵🟡</span>
        <span class="name">ぷよぷよ</span>
        <span class="desc">同じ色を4つつなげて連鎖を狙おう</span>
      </a>
      <a class="card tetris" href="/tetris">
        <span class="emoji">🟦🟨🟪🟥</span>
        <span class="name">テトリス</span>
        <span class="desc">ブロックを並べてラインを消そう</span>
      </a>
      <a class="card profile" href="/profile">
        <span class="emoji">💊🎾🎮</span>
        <span class="name">プロフィール</span>
        <span class="desc">作者の自己紹介はこちら</span>
      </a>
    </div>
    <footer>タップしてゲームを選択 / ホーム画面に追加すると全画面で遊べます</footer>
  </div>
</body>
</html>
