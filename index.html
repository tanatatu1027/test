<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f1020" />
  <title>ぷよぷよ for iPad</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="stat">
        <span class="label">SCORE</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">CHAIN</span>
        <span id="chain" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">BEST</span>
        <span id="best" class="value">0</span>
      </div>
    </header>

    <main class="play-area">
      <div class="board-wrap">
        <canvas id="board"></canvas>
        <div id="overlay" class="overlay">
          <div class="overlay-card">
            <h1 id="overlay-title">ぷよぷよ</h1>
            <p id="overlay-text">同じ色を4つつなげて消そう！<br />画面をタップ、またはスタートで開始</p>
            <button id="start-btn" class="btn">スタート</button>
          </div>
        </div>
      </div>

      <div class="side">
        <div class="panel">
          <span class="label">NEXT</span>
          <canvas id="next" width="64" height="128"></canvas>
        </div>
      </div>
    </main>

    <footer class="controls">
      <button class="ctrl" data-action="left" aria-label="左へ移動">◀</button>
      <button class="ctrl" data-action="rotateCcw" aria-label="左回転">↺</button>
      <button class="ctrl" data-action="rotateCw" aria-label="右回転">↻</button>
      <button class="ctrl" data-action="right" aria-label="右へ移動">▶</button>
      <button class="ctrl wide" data-action="drop" aria-label="落とす">DROP</button>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
